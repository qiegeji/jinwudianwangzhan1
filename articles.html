<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>近舞点 - 最新文章</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ff5833',
                        bgcream: '#fff8f4',
                        darktext: '#2a3140',
                        graytext: '#6b778c',
                        footerbg: '#303848'
                    },
                    fontFamily: {
                        sans: ['system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .top-banner-bg{
                background: linear-gradient(180deg, #fff8f6 0%, #ffffff 100%);
            }
        }
    </style>
</head>
<body class="bg-white text-darktext">
    <!-- 导航栏【已移除管理后台链接】 -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-primary rounded-lg flex items-center justify-center text-white">
                    <i class="fa fa-check"></i>
                </div>
                <span class="text-xl font-bold text-primary">近舞点</span>
            </div>
            <nav class="gap-6 hidden md:flex">
                <a onclick="goHome()" class="text-graytext hover:text-primary cursor-pointer transition-colors">首页</a>
                <a href="#" class="text-primary font-medium">文章</a>
            </nav>
        </div>
    </header>

    <!-- 文章头部区域 -->
    <section class="top-banner-bg py-12 px-6 text-center">
        <h1 class="text-[clamp(1.8rem,3vw,2.2rem)] font-bold">最新文章</h1>
        <p class="text-graytext mt-3">广场舞资讯、活动通知、舞蹈教程</p>
        <button onclick="goHome()" class="mt-4 border border-primary text-primary rounded-full px-6 py-2 hover:bg-primary hover:text-white transition-all duration-300">
            ← 返回首页
        </button>

        <!-- 顶部小程序码 -->
        <div class="mt-8 flex flex-col items-center">
            <img src="static/img/mini-qrcode.png" alt="近舞点小程序码" class="w-[160px] border-4 border-white shadow-md rounded-xl">
            <p class="text-graytext mt-3 text-sm">微信扫码快速使用小程序</p>
        </div>
    </section>

    <!-- 主体内容 -->
    <main class="max-w-7xl mx-auto px-6 py-10">
        <div class="text-left mb-8">
            <button class="bg-primary text-white rounded-full px-6 py-2">全部</button>
        </div>
        <div class="py-24 text-center">
            <div class="text-gray-400 text-5xl mb-4">
                <i class="fa fa-file-text-o"></i>
            </div>
            <p class="text-graytext">暂无文章</p>
        </div>
    </main>

    <!-- 底部小程序码区域 -->
    <section class="py-12 px-6 bg-bgcream text-center">
        <div class="max-w-md mx-auto">
            <h3 class="text-xl font-bold mb-4">扫码打开近舞点小程序</h3>
            <img src="static/img/mini-qrcode.png" alt="小程序码" class="w-[160px] mx-auto border-4 border-white shadow rounded-xl">
            <p class="text-graytext mt-4">查找周边广场舞队伍、查看活动场地</p>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="bg-footerbg text-white py-14 px-6 text-center mt-12">
        <div class="flex items-center justify-center gap-2 mb-3">
            <div class="w-9 h-9 bg-primary rounded-lg flex items-center justify-center text-white">
                <i class="fa fa-check"></i>
            </div>
            <span class="text-xl font-bold">近舞点</span>
        </div>
        <p class="text-gray-300">让每个跳舞的人都能找到组织</p>
        <div class="w-16 h-[1px] bg-gray-600 mx-auto my-6"></div>
        <p class="text-gray-400 text-sm">© 2025 近舞点 JinWuDian. All rights reserved.</p>
    </footer>

    <script>
        function goHome() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
